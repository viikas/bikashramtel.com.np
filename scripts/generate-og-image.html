<!doctype html>
<!--
  Link-preview (Open Graph) image generator.
  Run `npm run dev`, then screenshot this page at exactly 1200×630:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=public/og-image.png "http://localhost:5173/scripts/generate-og-image.html"

  Optional query params: ?offset=<road position>&stage=<stage id>
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG image — 1200×630</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; background: #cdeefe; }
  canvas { position: absolute; inset: 0; width: 1200px; height: 632px; image-rendering: pixelated; }
  .card {
    position: absolute; left: 64px; top: 56px; width: 640px; padding: 32px 36px;
    background: #f4efe2; border: 6px solid #1b1b2f; box-shadow: 10px 10px 0 #1b1b2f;
    font-family: 'Chakra Petch', sans-serif; color: #1b1b2f;
  }
  .player { font: 14px 'Press Start 2P', monospace; letter-spacing: 1px; }
  h1 {
    margin-top: 18px; font: 56px/1.15 'Press Start 2P', monospace; color: #e83b3b;
    text-shadow: 5px 5px 0 #1b1b2f;
  }
  .role {
    display: inline-block; margin-top: 22px; padding: 10px 14px; background: #1b1b2f; color: #ffd93b;
    font: 18px 'Press Start 2P', monospace;
  }
  .line { margin-top: 18px; font-size: 26px; font-weight: 600; }
  .line span { color: #c0262a; }
  .stats { display: flex; gap: 14px; margin-top: 22px; }
  .stat { padding: 10px 14px; background: #fff; border: 4px solid #1b1b2f; }
  .stat b { display: block; font: 22px 'Press Start 2P', monospace; color: #c0262a; }
  .stat small { display: block; margin-top: 8px; font: 10px 'Press Start 2P', monospace; }
  .url {
    position: absolute; right: 48px; bottom: 40px; padding: 10px 14px; background: #f4efe2;
    border: 4px solid #1b1b2f; font: 14px 'Press Start 2P', monospace; color: #1b1b2f;
  }
</style>
</head>
<body>
<canvas id="road" width="300" height="158"></canvas>
<div class="card">
  <div class="player">1P · KATHMANDU, NEPAL</div>
  <h1>BIKASH<br />RAMTEL</h1>
  <div class="role">LEAD SOFTWARE ENGINEER</div>
  <div class="line">Leading Container Tracking <span>@</span> PortPro</div>
  <div class="stats">
    <div class="stat"><b>12+</b><small>YEARS</small></div>
    <div class="stat"><b>100,000+</b><small>CONTAINERS TRACKED</small></div>
    <div class="stat"><b>550+</b><small>TRUCKING COMPANIES</small></div>
  </div>
</div>
<div class="url">BIKASHRAMTEL.COM.NP</div>
<script type="module">
  import { drawScene, paintSky } from '/src/components/RoadCanvas/scene.js'
  import { curveAt } from '/src/game/road.js'

  const q = new URLSearchParams(location.search)
  const offset = Number(q.get('offset') ?? 5600)
  const stageId = q.get('stage') ?? 'portpro'
  const canvas = document.getElementById('road')
  const { width, height } = canvas
  const groundBottom = height
  const bgCtx = document.createElement('canvas').getContext('2d')
  paintSky(bgCtx, width, height, groundBottom)
  drawScene(canvas.getContext('2d'), {
    bg: bgCtx.canvas, width, height, groundBottom, offset, curve: curveAt(offset), stageId,
    rivals: [{ z: 1700, lane: 0.45, jacket: 'blue' }, { z: 3200, lane: -0.5, jacket: 'green' }],
  })
</script>
</body>
</html>
